<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - My Blog</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<header class="navbar">
    <a class="logo" href="/">My Blog</a>
    <a class="new-post" href="/login">Log In</a>
</header>

<main class="form-container">

    <div class="form-header">
        <p class="small-heading">JOIN MY BLOG</p>
        <h1>Create your account.</h1>
        <p>Start sharing your ideas with the community.</p>
    </div>

    <form class="post-form"
          th:action="@{/register}"
          th:object="${user}"
          method="post">

        <div class="form-group">
            <label for="username">Username</label>
            <input type="text"
                   id="username"
                   th:field="*{username}"
                   placeholder="Choose a username"
                   required>
            <p class="field-error"
               th:if="${#fields.hasErrors('username')}"
               th:errors="*{username}"></p>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email"
                   id="email"
                   th:field="*{email}"
                   placeholder="you@example.com"
                   required>
            <p class="field-error"
               th:if="${#fields.hasErrors('email')}"
               th:errors="*{email}"></p>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password"
                   id="password"
                   th:field="*{password}"
                   placeholder="Create a password"
                   required>
            <p class="field-error"
               th:if="${#fields.hasErrors('password')}"
               th:errors="*{password}"></p>
        </div>

        <div class="form-actions">
            <a href="/" class="cancel-button">Cancel</a>
            <button type="submit">Create Account →</button>
        </div>

    </form>

</main>

<footer>
    <p>© 2026 My Blog · Honey Aswani · Built with Spring Boot</p>
</footer>

</body>
</html>
