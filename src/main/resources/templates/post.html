<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${post.title}">Post</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<header class="navbar">
    <a class="logo" href="/">My Blog</a>

    <div class="nav-actions">
        <a class="nav-link" href="/">Home</a>
        <a class="new-post" href="/new">+ Write Post</a>
    </div>
</header>

<main class="single-post-container">

    <article class="single-post">

        <a class="back-link" href="/">← Back to posts</a>

        <p class="post-number">
            #<span th:text="${post.id}"></span>
        </p>

        <h1 th:text="${post.title}">Post Title</h1>

        <div class="single-author">
            Written by
            <strong th:text="${post.author.username}">Author</strong>
        </div>

        <div class="single-content" th:text="${post.content}">
            Post content goes here...
        </div>

        <div class="single-post-actions">

            <a class="edit"
               th:if="${isOwner}"
               th:href="@{/edit/{id}(id=${post.id})}">
                Edit Post
            </a>

            <form th:action="@{/delete/{id}(id=${post.id})}"
                  method="post"
                  style="display: inline;">

                <button type="submit"
                        class="delete"
                        onclick="return confirm('Are you sure you want to delete this post?');">
                    Delete Post
                </button>

            </form>

        </div>

    </article>

</main>

<footer>
    <p>© 2026 My Blog · Honey Aswani · Built with Spring Boot</p>
</footer>

</body>
</html>
