<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Write Post - My Blog</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<header class="navbar">
    <a class="logo" href="/">My Blog</a>
    <a class="new-post" href="/">← Back to Blog</a>
</header>

<main class="form-container">

    <div class="form-header">
        <p class="small-heading">NEW POST</p>
        <h1>Write something worth sharing.</h1>
        <p>Share your ideas, experiences or something you're learning.</p>
    </div>

    <form class="post-form"
          th:action="@{/save}"
          th:object="${post}"
          method="post">

        <div class="form-group">
            <label for="title">Title</label>
            <input type="text"
                   id="title"
                   th:field="*{title}"
                   placeholder="Enter your post title"
                   required>
            <p class="field-error"
               th:if="${#fields.hasErrors('title')}"
               th:errors="*{title}"></p>
        </div>

        <div class="form-group">
            <label for="content">Content</label>
            <textarea id="content"
                      th:field="*{content}"
                      placeholder="Write your thoughts here..."
                      rows="10"
                      required></textarea>
            <p class="field-error"
               th:if="${#fields.hasErrors('content')}"
               th:errors="*{content}"></p>
        </div>

        <div class="form-actions">
            <a href="/" class="cancel-button">Cancel</a>
            <button type="submit">Publish Post →</button>
        </div>

    </form>

</main>

<footer>
    <p>© 2026 My Blog · Honey Aswani · Built with Spring Boot</p>
</footer>

</body>
</html>
